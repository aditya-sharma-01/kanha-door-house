services:
  # Option A: Render Static Site (Free 1-Click Hosted SPA)
  - type: web
    name: kanha-door-house
    env: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: true

